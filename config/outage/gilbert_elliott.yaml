# ─────────────────────────────────────────────────────────────
# Kinbridge-Sync — Gilbert-Elliott outage model configuration
# Two-state Markov chain: Good (G) ↔ Bad (B)
# π_B = p_GB / (p_GB + p_BG)
# ─────────────────────────────────────────────────────────────

# Transition probabilities per target average outage duration
# π_B × total_sim_time = target_outage_duration
# p_BG is calibrated from target outage length and desired recovery speed.
#
# For a target average outage of T_out seconds within a total simulation
# window T_sim, we need π_B = T_out / T_sim, so:
#   p_GB / (p_GB + p_BG) = T_out / T_sim
# Choose p_BG, then solve for p_GB.

profiles:
  baseline:
    total_sim_time_s: 3600
    target_outage_s: 90
    p_bg: 0.1  # recovery probability per step

  short_outage:
    total_sim_time_s: 3600
    target_outage_s: 10
    p_bg: 0.1

  long_outage:
    total_sim_time_s: 3600
    target_outage_s: 300
    p_bg: 0.1

  no_outage:
    total_sim_time_s: 3600
    target_outage_s: 0
    p_bg: 0.1

# Time step granularity (seconds)
tick_s: 1.0
